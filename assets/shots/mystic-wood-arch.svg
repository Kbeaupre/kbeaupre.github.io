  <rect class="side" x="640" y="350" width="576" height="130" rx="12"/><text x="664" y="388" class="t">gameReducer(state, action) → state</text><text x="664" y="418" class="s">Never rolls dice and never reads the clock: dice arrive in the action,</text><text x="664" y="442" class="s">so every turn is deterministic and replayable under test.</text>
