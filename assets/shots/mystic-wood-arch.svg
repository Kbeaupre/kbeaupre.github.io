  <rect class="box" x="640" y="190" width="576" height="100" rx="12"/><text x="664" y="228" class="t">Rolls the dice, dispatches actions</text><text x="664" y="258" class="s">Modals for encounters, jousts, the Tower, fountain, power limit</text>
