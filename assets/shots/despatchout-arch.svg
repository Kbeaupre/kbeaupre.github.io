<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a786f"/></marker>
  <style>.box{fill:#fff;stroke:#d9d5ca;stroke-width:1.5}.t{font-size:22px;font-weight:600;fill:#1b1b19}.s{font-size:16px;fill:#66655f}.h{font-size:15px;font-weight:700;fill:#2d6a4f;letter-spacing:.12em}.side{fill:#e4f1e9;stroke:#2d6a4f;stroke-width:1.5}.warn{fill:#fbefe3;stroke:#c0702b;stroke-width:1.5}.w{font-size:20px;font-weight:600;fill:#fff}.ln{stroke:#7a786f;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#7a786f;stroke-width:1.5;fill:none;stroke-dasharray:5 6;marker-end:url(#a)}.lbl{font-size:14px;fill:#66655f}</style></defs>
  <rect width="1280" height="800" fill="#faf9f6"/>
  <text x="64" y="80" font-size="34" font-weight="700" fill="#1b1b19">DespatchOut — the despatch board</text>
  <text x="64" y="114" class="s">Orders flow from the ERP to pickers to carriers; the gates live in the API, not the screen.</text>
  <text x="64" y="186" class="h">ONE BOARD PER REGION, OR ONE COMBINED BOARD</text>
  <rect class="box" x="64" y="206" width="200" height="190" rx="12"/><text x="86" y="246" class="t">Funnel</text><text x="86" y="278" class="s">synced orders,</text><text x="86" y="302" class="s">triaged by a</text><text x="86" y="326" class="s">manager</text>
  <rect class="box" x="300" y="206" width="200" height="190" rx="12"/><text x="322" y="246" class="t">Assigned</text><text x="322" y="278" class="s">given to a picker</text>
  <rect class="side" x="536" y="206" width="200" height="190" rx="12"/><text x="558" y="246" class="t">In progress</text><text x="558" y="278" class="s">required before</text><text x="558" y="302" class="s">completion, so</text><text x="558" y="326" class="s">handling time is</text><text x="558" y="350" class="s">measurable</text>
  <rect class="box" x="772" y="206" width="200" height="190" rx="12"/><text x="794" y="246" class="t">Awaiting</text><text x="794" y="276" class="t">booking</text><text x="794" y="308" class="s">carrier, pallets</text>
  <rect class="dk" fill="#2d6a4f" x="1008" y="206" width="208" height="190" rx="12"/><text x="1030" y="246" class="w">Completed</text><text x="1030" y="282" font-size="16" fill="#fff">logged, reportable</text>
  <path class="ln" d="M264 301 H300"/><path class="ln" d="M500 301 H536"/><path class="ln" d="M736 301 H772"/><path class="ln" d="M972 301 H1008"/>
  <text x="64" y="476" class="h">WHAT RIDES ON EACH CARD</text>
  <rect class="warn" x="64" y="496" width="360" height="190" rx="12"/><text x="86" y="536" class="t">No-stock flag</text><text x="86" y="570" class="s">Short at this order's warehouse?</text><text x="86" y="594" class="s">Shows the arrival date and which</text><text x="86" y="618" class="s">assemblies would fix it. Advisory,</text><text x="86" y="642" class="s">never blocks, five queries a page.</text>
  <rect class="box" x="460" y="496" width="360" height="190" rx="12"/><text x="482" y="536" class="t">Campaign check</text><text x="482" y="570" class="s">A temporary pack variant ships under</text><text x="482" y="594" class="s">a normal SKU. At Started the board</text><text x="482" y="618" class="s">asks which shipped, and prints it on</text><text x="482" y="642" class="s">the paperwork. Enforced server-side.</text>
  <rect class="box" x="856" y="496" width="360" height="190" rx="12"/><text x="878" y="536" class="t">Paperwork</text><text x="878" y="570" class="s">Handling sheets, packing</text><text x="878" y="594" class="s">instructions, pallet labels.</text><text x="878" y="618" class="s">Pallet numbers are recorded before</text><text x="878" y="642" class="s">rendering, so none is ever reissued.</text>
</svg>
