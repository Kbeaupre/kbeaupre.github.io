<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a786f"/></marker>
  <style>.box{fill:#fff;stroke:#d9d5ca;stroke-width:1.5}.t{font-size:22px;font-weight:600;fill:#1b1b19}.s{font-size:16px;fill:#66655f}.h{font-size:15px;font-weight:700;fill:#2d6a4f;letter-spacing:.12em}.side{fill:#e4f1e9;stroke:#2d6a4f;stroke-width:1.5}.warn{fill:#fbefe3;stroke:#c0702b;stroke-width:1.5}.w{font-size:20px;font-weight:600;fill:#fff}.ln{stroke:#7a786f;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#7a786f;stroke-width:1.5;fill:none;stroke-dasharray:5 6;marker-end:url(#a)}.lbl{font-size:14px;fill:#66655f}</style></defs>
  <rect width="1280" height="800" fill="#faf9f6"/>
  <text x="64" y="80" font-size="34" font-weight="700" fill="#1b1b19">Sphere — the CRM, inside the platform</text>
  <text x="64" y="114" class="s">Customers, orders, forecasts and joint business plans; every order is pushed to the ERP exactly once.</text>
  <text x="64" y="176" class="h">WORK</text><text x="64" y="352" class="h">SALES</text><text x="64" y="528" class="h">INTELLIGENCE</text>
  <rect class="box" x="64" y="192" width="330" height="130" rx="12"/><text x="88" y="232" class="t">Dashboard · Tasks</text><text x="88" y="262" class="s">Pipeline of deals</text><text x="88" y="288" class="s">Personal task list, overdue badge</text>
  <rect class="box" x="64" y="368" width="330" height="130" rx="12"/><text x="88" y="408" class="t">Customers · Orders</text><text x="88" y="438" class="s">Create, edit, CSV or PO-PDF import</text><text x="88" y="464" class="s">Forecasts · pre-sale campaigns</text>
  <rect class="box" x="64" y="544" width="330" height="130" rx="12"/><text x="88" y="584" class="t">Action feed · What to pitch</text><text x="88" y="614" class="s">Data-backed suggestions per rep</text><text x="88" y="640" class="s">Joint business plans</text>
  <text x="470" y="176" class="h">SALES-ORDER PUSH — NEVER A DUPLICATE</text>
  <rect class="box" x="470" y="200" width="170" height="70" rx="12"/><text x="492" y="242" class="t">confirmed</text>
  <rect class="side" x="700" y="200" width="170" height="70" rx="12"/><text x="728" y="242" class="t">pushing</text>
  <rect class="dk" fill="#2d6a4f" x="930" y="200" width="170" height="70" rx="12"/><text x="966" y="242" class="w">pushed</text>
  <path class="ln" d="M640 235 H700"/><path class="ln" d="M870 235 H930"/>
  <text x="640" y="190" class="lbl">row-locked first</text><text x="858" y="190" class="lbl"></text>
  <rect class="warn" x="700" y="340" width="170" height="70" rx="12"/><text x="710" y="382" class="t" font-size="20">push_unknown</text>
  <path class="ln" d="M785 270 V340"/><text x="796" y="312" class="lbl">timeout / 5xx</text>
  <rect class="box" x="930" y="340" width="286" height="70" rx="12"/><text x="950" y="370" class="s">retry: search the ERP for the</text><text x="950" y="392" class="s">order comment, adopt if found</text>
  <path class="ln" d="M870 375 H930"/><path class="ln" d="M1073 340 V270"/>
  <text x="470" y="470" class="h">GUARANTEES</text>
  <rect class="box" x="470" y="490" width="746" height="184" rx="12"/>
  <text x="494" y="528" class="s">• Save = re-push: the ERP accepts the edit first, then it is committed locally.</text>
  <text x="494" y="560" class="s">• The whole ERP object is round-tripped, because a rebuilt update is silently ignored.</text>
  <text x="494" y="592" class="s">• A failed lookup is never read as "not there".</text>
  <text x="494" y="624" class="s">• Agreed business plans lock; deleting one needs a typed confirmation.</text>
  <text x="494" y="656" class="s">• Scheduled intelligence jobs are single-flight (advisory locks); a clash is "skipped", not "error".</text>
</svg>
