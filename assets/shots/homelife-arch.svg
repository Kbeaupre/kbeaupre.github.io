<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a786f"/></marker>
  <style>.box{fill:#fff;stroke:#d9d5ca;stroke-width:1.5}.t{font-size:22px;font-weight:600;fill:#1b1b19}.s{font-size:16px;fill:#66655f}.h{font-size:15px;font-weight:700;fill:#2d6a4f;letter-spacing:.12em}.side{fill:#e4f1e9;stroke:#2d6a4f;stroke-width:1.5}.dk{fill:#2d6a4f}.w{font-size:20px;font-weight:600;fill:#fff}.ln{stroke:#7a786f;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#7a786f;stroke-width:1.5;fill:none;stroke-dasharray:5 6;marker-end:url(#a)}</style></defs>
  <rect width="1280" height="800" fill="#faf9f6"/>
  <text x="64" y="80" font-size="34" font-weight="700" fill="#1b1b19">HomeLifeHQ — one household, one source of truth</text>
  <text x="64" y="114" class="s">Bank sync feeds the budget; the same data drives a wall-mounted display.</text>
  <text x="64" y="180" class="h">BANK</text>
  <rect class="box" x="64" y="200" width="280" height="130" rx="12"/><text x="88" y="244" class="t">Monzo</text><text x="88" y="276" class="s">OAuth connect · webhooks</text>
  <rect class="box" x="64" y="360" width="280" height="130" rx="12"/><text x="88" y="404" class="t">pg_cron</text><text x="88" y="436" class="s">6-hourly catch-up sync</text>
  <text x="400" y="180" class="h">SUPABASE</text>
  <rect class="side" x="400" y="200" width="400" height="290" rx="12"/>
  <text x="424" y="244" class="t">Postgres + RLS</text><text x="424" y="276" class="s">household-scoped tables</text><text x="424" y="302" class="s">private transactions, shared totals</text>
  <text x="424" y="344" class="t">Edge functions</text><text x="424" y="376" class="s">webhook ingest (secret path, 404s)</text><text x="424" y="402" class="s">idempotent upserts + re-categorise</text><text x="424" y="428" class="s">subscribable calendar feed (ICS)</text><text x="424" y="454" class="s">push nudges</text>
  <text x="856" y="180" class="h">SURFACES</text>
  <rect class="box" x="856" y="200" width="360" height="130" rx="12"/><text x="880" y="244" class="t">Budget app</text><text x="880" y="276" class="s">bills · pots · debts · scenarios</text>
  <rect class="box" x="856" y="360" width="360" height="130" rx="12"/><text x="880" y="404" class="t">Wall hub (kiosk)</text><text x="880" y="436" class="s">read-only, always-on tablet</text>
  <rect class="box" x="856" y="520" width="360" height="130" rx="12"/><text x="880" y="564" class="t">Calendar apps</text><text x="880" y="596" class="s">subscribe by private token URL</text>
  <path class="ln" d="M344 265 H400"/><path class="ln" d="M344 425 H400"/><path class="ln" d="M800 265 H856"/><path class="ln" d="M800 425 H856"/><path class="dash" d="M800 470 C 830 470 830 585 856 585"/>
  <text x="64" y="600" class="s">Chores, recipes, meal planner, documents, maintenance and more on the same model.</text>
</svg>
