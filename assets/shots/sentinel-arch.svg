<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a786f"/></marker>
  <style>.box{fill:#fff;stroke:#d9d5ca;stroke-width:1.5}.t{font-size:22px;font-weight:600;fill:#1b1b19}.s{font-size:16px;fill:#66655f}.h{font-size:15px;font-weight:700;fill:#2d6a4f;letter-spacing:.12em}.side{fill:#e4f1e9;stroke:#2d6a4f;stroke-width:1.5}.warn{fill:#fbefe3;stroke:#c0702b;stroke-width:1.5}.w{font-size:20px;font-weight:600;fill:#fff}.ln{stroke:#7a786f;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#7a786f;stroke-width:1.5;fill:none;stroke-dasharray:5 6;marker-end:url(#a)}.lbl{font-size:14px;fill:#66655f}</style></defs>
  <rect width="1280" height="800" fill="#faf9f6"/>
  <text x="64" y="80" font-size="34" font-weight="700" fill="#1b1b19">Sentinel — packaging compliance, reconciled</text>
  <text x="64" y="114" class="s">Packaging data lives once on each component; finished products inherit it through the bill of materials.</text>
  <text x="64" y="186" class="h">MASTER DATA</text>
  <rect class="box" x="64" y="206" width="250" height="150" rx="12"/><text x="86" y="246" class="t">Components</text><text x="86" y="276" class="s">material · weight · class</text><text x="86" y="300" class="s">recyclability · evidence</text>
  <rect class="box" x="374" y="206" width="250" height="150" rx="12"/><text x="396" y="246" class="t">Bills of materials</text><text x="396" y="276" class="s">SKUs inherit components</text><text x="396" y="300" class="s">one weight formula</text>
  <rect class="box" x="684" y="206" width="250" height="150" rx="12"/><text x="706" y="246" class="t">Placed on market</text><text x="706" y="276" class="s">completed invoices, less</text><text x="706" y="300" class="s">credits for returned goods</text>
  <rect class="dk" fill="#2d6a4f" x="994" y="206" width="222" height="150" rx="12"/><text x="1014" y="246" class="w">Submission</text><text x="1014" y="280" font-size="16" fill="#fff">workbook per country</text><text x="1014" y="304" font-size="16" fill="#fff">and half-year</text>
  <path class="ln" d="M314 281 H374"/><path class="ln" d="M624 281 H684"/><path class="ln" d="M934 281 H994"/>
  <text x="64" y="436" class="h">RULES THAT KEEP THE NUMBERS HONEST</text>
  <rect class="side" x="64" y="456" width="360" height="230" rx="12"/><text x="86" y="496" class="t">Overrides survive rebuilds</text><text x="86" y="530" class="s">Keyed by a stable signature of</text><text x="86" y="554" class="s">parent + component identity, not a</text><text x="86" y="578" class="s">row id — a full rebuild would</text><text x="86" y="602" class="s">otherwise orphan every one.</text>
  <rect class="side" x="460" y="456" width="360" height="230" rx="12"/><text x="482" y="496" class="t">No double counting</text><text x="482" y="530" class="s">A sub-assembly's outer box is</text><text x="482" y="554" class="s">stripped when it is repacked inside</text><text x="482" y="578" class="s">a larger parent, on every surface,</text><text x="482" y="602" class="s">so all totals reconcile.</text>
  <rect class="side" x="856" y="456" width="360" height="230" rx="12"/><text x="878" y="496" class="t">One source of truth</text><text x="878" y="530" class="s">The summary sheet is a plain</text><text x="878" y="554" class="s">aggregate of the detail sheet, so</text><text x="878" y="578" class="s">the two cannot disagree. Country:</text><text x="878" y="602" class="s">delivery → customer → unknown.</text>
</svg>
