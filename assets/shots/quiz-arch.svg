<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a786f"/></marker>
  <style>.box{fill:#fff;stroke:#d9d5ca;stroke-width:1.5}.t{font-size:22px;font-weight:600;fill:#1b1b19}.s{font-size:16px;fill:#66655f}.h{font-size:15px;font-weight:700;fill:#2d6a4f;letter-spacing:.12em}.side{fill:#e4f1e9;stroke:#2d6a4f;stroke-width:1.5}.dk{fill:#2d6a4f}.w{font-size:20px;font-weight:600;fill:#fff}.ln{stroke:#7a786f;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#7a786f;stroke-width:1.5;fill:none;stroke-dasharray:5 6;marker-end:url(#a)}</style></defs>
  <rect width="1280" height="800" fill="#faf9f6"/>
  <text x="64" y="80" font-size="34" font-weight="700" fill="#1b1b19">Quiz night over video</text>
  <text x="64" y="114" class="s">Top-10 style rounds: hidden answers, host reveals, server keeps the rules.</text>
  <text x="64" y="190" class="h">PLAYERS &amp; HOST (BROWSER)</text>
  <rect class="box" x="64" y="210" width="360" height="360" rx="12"/><text x="88" y="254" class="t">React + LiveKit client</text><text x="88" y="294" class="s">Video grid for the whole room</text><text x="88" y="322" class="s">Answer entry, locked per turn</text><text x="88" y="350" class="s">Scoreboard</text><text x="88" y="410" class="t">Host controls</text><text x="88" y="448" class="s">pick question · reveal slot</text><text x="88" y="476" class="s">reveal all · lock · skip turn</text><text x="88" y="504" class="s">award points · end quiz</text>
  <text x="500" y="190" class="h">NODE SERVER</text>
  <rect class="side" x="500" y="210" width="340" height="170" rx="12"/><text x="524" y="254" class="t">WebSocket state</text><text x="524" y="286" class="s">per-room players &amp; answers</text><text x="524" y="312" class="s">turn order, rotating starter</text><text x="524" y="338" class="s">host-only messages enforced</text>
  <rect class="side" x="500" y="400" width="340" height="170" rx="12"/><text x="524" y="444" class="t">Token endpoint</text><text x="524" y="476" class="s">mints short-lived room tokens</text><text x="524" y="502" class="s">question bank behind a host key</text>
  <text x="916" y="190" class="h">VIDEO</text>
  <rect class="box" x="916" y="210" width="300" height="170" rx="12"/><text x="940" y="254" class="t">LiveKit</text><text x="940" y="286" class="s">real-time video + data channel</text>
  <rect class="box" x="916" y="400" width="300" height="170" rx="12"/><text x="940" y="444" class="t">Tunnel scripts</text><text x="940" y="476" class="s">one command to host a night</text>
  <path class="ln" d="M424 295 H500"/><path class="ln" d="M424 485 H500"/><path class="dash" d="M424 250 C 600 150 800 150 916 250"/>
  <text x="64" y="660" class="s">Started as a single-file prototype; grew a server to own turn order and scoring.</text>
</svg>
